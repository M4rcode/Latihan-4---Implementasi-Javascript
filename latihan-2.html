<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=1200">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/style_2.css">
</head>
<body>
    <div class="container">
        <div class="header" style="padding: 25px;">
            <div class="logo_header">
                <div>
                    <h2 style="color: white; font-size: 20px; text-align: center; margin:auto">Latihan Pertemuan 6</h2>
                </div>
            </div>
            <div class="button_header">
                <a href="latihan-1.html" class="button" style="color: white;">Latihan 1</a>
                <a href="latihan-2.html" class="button" style="text-decoration: underline; color: white;">Latihan 2</a>
                <a href="latihan-3.html" class="button" style="color: white;">Latihan 3</a>
                <a href="latihan-4.html" class="button" style="color: white;">Latihan 4</a>
            </div>
        </div>

        <div class="card">
            <form class="form">
                <h1 style="font-size: 25px; color: #A1D890;">Pencarian Kode Pos</h1>
                <hr style="width: 100%;">
                <div class="row-fields">
                    <div class="field">
                        <label for="provinsi">Provinsi</label>
                        <select id="provinsi" name="provinsi" class="input">
                            <option selected disabled>Pilih Provinsi</option>
                            <option>Jawa Timur</option>
                            <option>Jawa Tengah</option>
                        </select>
                    </div>
                    
                    <div class="field">
                        <label for="kota-kabupaten">Kota/Kabupaten</label>
                        <select id="kota-kabupaten" name="kota-kabupaten" class="input">
                            <option selected disabled>Pilih Kota/Kab</option>
                            <option>Surabaya</option>
                            <option>Sidoarjo</option>
                        </select>
                    </div>
                    
                    <div class="field">
                        <label for="kecamatan">Kecamatan</label>
                        <select id="kecamatan" name="kecamatan" class="input">
                            <option selected disabled>Pilih Kecamatan</option>
                            <option>Sukolilo</option>
                            <option>Gubeng</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="fname">Kode Pos</label>
                    <input type="text" id="kode" name="kode" placeholder="Contoh: 60111" required class="input">
                </div>
                <button type="submit" class="submit" style="margin-top: 10px;">Search</button>
            </form>
        </div>
        <div id="hasil_pencarian" class="card" style="display: none;">

        </div>
        <script src="js/latihan-2.js"></script>
</body>
</html>
