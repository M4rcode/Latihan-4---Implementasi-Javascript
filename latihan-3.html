<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=1200">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/style_3.css">
</head>
<body>
    <div class="container">
        <div class="header" style="padding: 25px;">
            <div class="logo_header">
                <div>
                    <h2 style="color: white; font-size: 20px; text-align: center; margin:auto">Latihan Pertemuan 6</h2>
                </div>
            </div>
            <div class="button_header">
                <a href="index.html" class="button" style="color: white;">Latihan 1</a>
                <a href="latihan-2.html" class="button" style="color: white;">Latihan 2</a>
                <a href="latihan-3.html" class="button" style="text-decoration: underline; color: white;">Latihan 3</a>
                <a href="latihan-4.html" class="button" style="color: white;">Latihan 4</a>
            </div>
        </div>

        <div class="card">
            <form class="form" onsubmit="return validateForm()">
                <h1 style="font-size: 25px; color: #A1D890;">Registration Form</h1>
                <hr style="width: 100%;">
                <div class="field">
                    <div style="flex-direction: row; gap: 25px;">
                        <label for="fname">Full Name</label>
                        <span id="name-error" style="color: red; font-size: 12px;"></span>
                    </div>
                    <input type="text" id="fname" name="fname" placeholder="Contoh: John Doe" class="input">
                </div><br>
                <div class="field">
                    <div style="flex-direction: row; gap: 25px;">
                        <label for="address">Address</label>
                        <span id="address-error" style="color: red; font-size: 12px;"></span>
                    </div>
                    <input type="text" id="address" name="address" placeholder="Contoh: 231000" class="input">
                </div><br>
                <div class="field">
                    <div style="flex-direction: row; gap: 25px;">
                        <label for="email">Email Address</label>
                        <span id="email-error" style="color: red; font-size: 12px;"></span>
                    </div>
                    <input type="text" id="email" name="email" placeholder="Contoh: 231000" class="input">
                </div><br>
                <div class="field">
                    <div style="flex-direction: row; gap: 25px;">
                        <label for="password">Password</label> 
                        <span id="password-error" style="color: red; font-size: 12px;"></span>
                    </div>
                    <input type="text" id="password" name="password" placeholder="Contoh: 231000" class="input">
                    <span id="password-error" style="color: red; font-size: 12px;"></span>
                </div><br>

                <div class="field">
                    <div style="flex-direction: row; gap: 25px;">
                        <label for="course">Course</label>
                        <span id="course-error" style="color: red; font-size: 12px;"></span>
                    </div>
                    <select id="course" name="course" class="input">
                        <option selected disabled>Select Your Course</option>
                        <option>Teknik Informatika</option>
                        <option>Teknik Elektro</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Biomedik</option>
                        <option>Teknologi Informasi</option>
                        <option>Teknik Komputer</option>
                    </select>
                </div><br>

                <div class="field">
                    <label for="kampus">College Name</label>
                    <input type="text" id="kampus" name="kampus" placeholder="Contoh: 231000" class="input">
                </div><br>
                <div class="field" style="flex-direction: row;">
                    <input type="checkbox" id="agree" name="agree">
                    <label for="agree">I agree to the above information</label>
                </div><br>
                <span id="agree-error" style="color: red; font-size: 12px;"></span>
                <div class="row-button">
                    <button type="submit" class="submit">Submit</button>
                    <button type="reset" class="submit" onclick="resetErrors()">Reset</button>
                </div>
            </form>
            <script src="js/latihan-3.js"></script>
        </div>
</body>
</html>
