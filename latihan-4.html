<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=1200">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/style_4.css">
</head>
<body>
    <div class="container">
        <div class="header" style="padding: 25px;">
            <div class="logo_header">
                <div>
                    <h2 style="color: white; font-size: 20px; text-align: center; margin:auto">Latihan Pertemuan 6</h2>
                </div>
            </div>
            <div class="button_header">
                <a href="latihan-1.html" class="button" style="color: white;">Latihan 1</a>
                <a href="latihan-2.html" class="button" style="color: white;">Latihan 2</a>
                <a href="latihan-3.html" class="button" style="color: white;">Latihan 3</a>
                <a href="latihan-4.html" class="button" style="text-decoration: underline; color: white;">Latihan 4</a>
            </div>
        </div>

        <div class="card">
            <form class="form">
                <h1 style="font-size: 25px; color: #A1D890;">Pemilihan Produk</h1>
                <hr style="width: 100%;">
                <div class="row-fields">
                    <div class="row-fields">
                        <div class="field">
                            <label for="jenis_produk">Jenis Produk</label>
                            <!-- onchange memicu JavaScript saat produk dipilih -->
                            <select id="jenis_produk" name="jenis_produk" class="input" onchange="updateMerk()">
                                <option value="" selected disabled>Pilih Jenis Produk</option>
                                <option value="Desktop">Desktop</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Smartphone">Smartphone</option>
                            </select>
                        </div>
                        
                        <div class="field">
                            <label for="merk">Merk</label>
                            <!-- Pilihan merk akan diisi otomatis oleh JavaScript -->
                            <select id="merk" name="merk" class="input">
                                <option value="" selected disabled>Pilih Merk</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button  type="submit" class="submit" style="margin-top: 10px;">Submit</button>
            </form>
        </div>
</body>
</html>
